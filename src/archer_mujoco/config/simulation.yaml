single_arm_sim:
  ros__parameters:
    side: left
    use_sim_time: false

    # 500 physics steps per simulation second. Not a real-time guarantee.
    timestep: 0.002
    state_hz: 50.0
    viewer_hz: 30.0
    show_viewer: true

    # First validate joint trajectories without convex-hull contact interference.
    # Enable later when collision geometry has been verified.
    enable_contacts: false
    gravity_compensation: true

    # Simulation-only gains, not hardware settings.
    position_kp: 80.0
    position_kv: 8.0
    speed_limits: [0.1, 0.5, 0.5, 0.5, 0.5, 0.5]

    # Provisional fingertip midpoint, expressed in the gripper frame (meters).
    tcp_xyz: [0.0, 0.0, 0.147]
    mount_xyz: [0.0, 0.0, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]