# 默认不连接、不使能。确认开关尚未打开时，连接服务会明确拒绝。
# 两臂参数按 joint_1 到 joint_6 顺序填写；角度 rad，速度 rad/s，加速度 rad/s²。
# 技术角度范围来源：《PICO4_HEXFELLOW_Archer-Y6_项目技术资料汇编》表16。
# 原文角度：J1 [-150,180]；J2 [-90,120]；J3 [0,180]；J4/J5 ±90；J6 ±170 度。
# 其余范围保持原交集；用户授权J2/J4项目软件下限由-1.57放宽至-1.575rad。
# 此0.005rad工程余量与模型、规划默认值同步，不修改控制器固件限位。
# 官方URDF上下界rad：J1[-2.61,3.14]、J2[-1.57,2.09]、J3[0,3.14]、
# J4/J5[-1.57,1.57]、J6[-2.96,2.96]；当前模型另将J1上界限制2.79、J5限制±1.55。
# 这里收紧的是项目目标范围，不是读取或改写控制器内部限位，也不扩大URDF。
# 原文硬件最大速度：J1～J4 为 320 度/秒；J5/J6 为 720 度/秒。
# 用户于2026-10-20指定完整任务候选限速0.50 rad/s；尚未在该速度下完成真机任务验收。
# 本文件仅用于用户授权的0.30 rad/s²画圆试跑，不替换正式全局加速度配置。
# 文档没有给出最大加速度，不能把项目的 0.10 当作厂家额定参数。
# 用户允许初始轻微工程偏差；读取容差为 0.005 rad，约 0.286 度。
# 实测初值保留原值；准备阶段只收回越界关节，正式运动及目标使用名义限位。
# 归位目标另行限制到名义边界，不修改初始记录、不依赖零力矩或失能。
# 容差不是扩大机械硬限位；设备自锁为用户说明，尚未进行实机验收。
# 保留 limits_confirmed=false 和自动连接关闭；采用实机配置的步骤留给反馈联调。
archer_position_driver:
  ros__parameters:
    arms: both
    connect_on_start: false
    # 显式enable按官方流程完成必要的单次API校准；启动或连接反馈不触发。
    # 与同一控制器的can0/8439左臂、can1/9439右臂进行软件同步；默认不开放。
    allow_paired_trajectory: false
    # 连续轨迹接入仍默认关闭，不会自动连接或使能；完整任务尚需几何与夹爪事件衔接。
    allow_continuous_trajectory: false
    # 完整文件还需实时起点、文件一致性和几何预检；抓取夹爪尚未接入，不开放抓取文件。
    allow_task_file_trajectory: false
    # 工程等待上限，覆盖指定超时清除、会话、初始化及校准，并非厂商承诺耗时。
    readiness_timeout: 10.0
    control_hz: 250
    startup_timeout: 10.0
    target_timeout: 5.0
    max_excursion: 0.05
    tracking_tolerance: 0.10
    feedback_tolerance: 0.005
    left_url: "ws://192.168.1.100:8439"
    right_url: "ws://192.168.1.100:9439"
    left_limits_confirmed: false
    right_limits_confirmed: false
    left_lower: [-2.61, -1.575, 0.0, -1.575, -1.55, -2.96]
    left_upper: [2.79, 2.09, 3.14, 1.57, 1.55, 2.96]
    left_max_velocity: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50]
    left_max_acceleration: [0.30, 0.30, 0.30, 0.30, 0.30, 0.30]
    right_lower: [-2.61, -1.575, 0.0, -1.575, -1.55, -2.96]
    right_upper: [2.79, 2.09, 3.14, 1.57, 1.55, 2.96]
    right_max_velocity: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50]
    right_max_acceleration: [0.30, 0.30, 0.30, 0.30, 0.30, 0.30]
    use_sim_time: false
