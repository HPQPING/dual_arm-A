# 默认不连接、不使能。确认开关尚未打开时，连接服务会明确拒绝。
# 两臂参数按 joint_1 到 joint_6 顺序填写；角度 rad，速度 rad/s，加速度 rad/s²。
# 角度范围来源：用户提供的《PICO4_HEXFELLOW_Archer-Y6_项目技术资料汇编》表 16。
# 原文角度：J1 [-150,180]；J2 [-90,120]；J3 [0,180]；J4/J5 ±90；J6 ±170 度。
# 原文硬件最大速度：J1～J4 为 320 度/秒；J5/J6 为 720 度/秒。
# 下面 0.05 rad/s 和 0.10 rad/s² 是项目小幅联调初始限速/限加速度，尚未实机验收。
# 文档没有给出最大加速度，不能把项目的 0.10 当作厂家额定参数。
# 用户允许初始轻微工程偏差；读取容差为 0.005 rad，约 0.286 度。
# 实测初值保留原值；准备阶段只收回越界关节，正式运动及目标使用名义限位。
# 归位目标另行限制到名义边界，不修改初始记录、不依赖零力矩或失能。
# 容差不是扩大机械硬限位；设备自锁为用户说明，尚未进行实机验收。
# 保留 limits_confirmed=false 和自动连接关闭；采用实机配置的步骤留给反馈联调。
archer_position_driver:
  ros__parameters:
    arms: both
    connect_on_start: false
    # 仅允许显式 enable 请求中的一次API校准，不会在启动或连接时校准。
    # 当前固件校准动作尚未实机验证；默认保持false，实际操作需另行选择。
    allow_api_calibration: false
    # 与同一控制器的can0/8439左臂、can1/9439右臂进行软件同步；默认不开放。
    allow_paired_trajectory: false
    # 工程等待上限，覆盖会话、初始化及校准全部步骤，并非厂商承诺耗时。
    readiness_timeout: 10.0
    control_hz: 250
    startup_timeout: 10.0
    target_timeout: 5.0
    return_duration: 5.0
    max_excursion: 0.05
    tracking_tolerance: 0.10
    feedback_tolerance: 0.005
    left_url: "ws://192.168.1.100:8439"
    right_url: "ws://192.168.1.100:9439"
    left_limits_confirmed: false
    right_limits_confirmed: false
    left_lower: [-2.6179938779914944, -1.5707963267948966, 0.0, -1.5707963267948966, -1.5707963267948966, -2.9670597283903604]
    left_upper: [3.141592653589793, 2.0943951023931953, 3.141592653589793, 1.5707963267948966, 1.5707963267948966, 2.9670597283903604]
    left_max_velocity: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
    left_max_acceleration: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
    right_lower: [-2.6179938779914944, -1.5707963267948966, 0.0, -1.5707963267948966, -1.5707963267948966, -2.9670597283903604]
    right_upper: [3.141592653589793, 2.0943951023931953, 3.141592653589793, 1.5707963267948966, 1.5707963267948966, 2.9670597283903604]
    right_max_velocity: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
    right_max_acceleration: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
    use_sim_time: false
