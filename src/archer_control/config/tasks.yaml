single_arm_task:
  ros__parameters:
    side: left
    use_sim_time: false
    # joint: existing joint waypoints; cartesian: XYZ samples; circle: generated samples.
    task_type: circle
    target_frame: base
    keep_current_orientation: true
    target_rpy: [0.0, 0.0, 0.0]

    # Used only in cartesian mode, three values per TCP position (meters).
    # Replace with measured/planned samples; add intermediate points for large moves.
    cartesian_waypoints: [0.30, 0.0, 0.40]

    # Circle begins at the current TCP; center offset -radius along local base X.
    # A small 5 mm radius XZ circle is the initial simulation example.
    circle_radius: 0.005
    circle_plane: xz
    circle_samples: 16

    # Must match the simulation model/launch configuration.
    tcp_xyz: [0.0, 0.0, 0.147]
    mount_xyz: [0.0, 0.0, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]

    # No movement on startup. Call /left/task/start or /right/task/start.
    minimum_duration: 1.0
    time_margin: 1.1
    feedback_timeout: 0.5
    start_velocity_limit: 0.01
    goal_tolerance: 0.02
    goal_hold_time: 0.3
    timeout_scale: 2.0
    timeout_extra: 10.0

    speed_limits: [0.1, 0.5, 0.5, 0.5, 0.5, 0.5]
    # Flat array: J1 lower/upper, J2 lower/upper, ... J6 lower/upper.
    joint_limits: [-2.79, 2.79, -1.575, 2.09, 0.0, 3.14,
                   -1.575, 1.57, -1.55, 1.55, -2.96, 2.96]

    # Six numbers per waypoint (radians). Small excursion then return.
    waypoints: [0.1, -0.7, 1.5, -0.8, 0.0, 0.0,
                0.0, -0.8, 1.6, -0.8, 0.0, 0.0]